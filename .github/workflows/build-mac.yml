name: Build macOS VST3 & AU (Apple Silicon + Intel Universal)

on:
  push:
    tags:
      - "mac-v*"
      - "central-v*"
      - "plugtune-dev*"
      - "underground-v*"
      - "plugged1-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. central-v2.4.0)'
        required: false
        default: 'central-v2.4.0'

jobs:
  build-macos:
    runs-on: macos-14 # Apple Silicon M1/M2/M3 native runner
    permissions:
      contents: write

    steps:
    - name: Check out private proprietary source repository
      uses: actions/checkout@v4
      with:
        repository: dylangoodm2468590840/pluggedin-source
        token: ${{ secrets.SOURCE_PAT }}
        submodules: recursive

    - name: Set up CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Configure CMake for Universal macOS (arm64 + x86_64)
      run: |
        cmake -B build -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="10.13"

    - name: Build macOS VST3, AU Component & Central App
      run: |
        cmake --build build --config Release --target UNDERGROUND_VST3
        cmake --build build --config Release --target UNDERGROUND_AU
        cmake --build build --config Release --target PluggedIN_Central
        cmake --build build --config Release --target Plugged_1_VST3
        cmake --build build --config Release --target Plugged_1_AU
        if cmake --build build --target help | grep -q "PlugTune_VST3"; then
          cmake --build build --config Release --target PlugTune_VST3 || true
          cmake --build build --config Release --target PlugTune_AU || true
        fi

    - name: Package macOS Artifacts
      run: |
        mkdir -p dist/mac
        
        # Ensure full 755 POSIX permissions and ad-hoc codesigning on all bundles
        chmod -R 755 build/UNDERGROUND_artefacts/Release/ 2>/dev/null || true
        chmod -R 755 build/Plugged_1_artefacts/Release/ 2>/dev/null || true
        chmod -R 755 build/PlugTune_artefacts/Release/ 2>/dev/null || true
        chmod -R 755 build/PluggedIN_Central_artefacts/Release/ 2>/dev/null || true
        
        codesign --force --deep --sign - "build/UNDERGROUND_artefacts/Release/VST3/UNDERGROUND.vst3" 2>/dev/null || true
        codesign --force --deep --sign - "build/UNDERGROUND_artefacts/Release/AU/UNDERGROUND.component" 2>/dev/null || true
        codesign --force --deep --sign - "build/Plugged_1_artefacts/Release/VST3/Plugged 1.vst3" 2>/dev/null || true
        codesign --force --deep --sign - "build/Plugged_1_artefacts/Release/AU/Plugged 1.component" 2>/dev/null || true
        codesign --force --deep --sign - "build/PlugTune_artefacts/Release/VST3/PlugTune.vst3" 2>/dev/null || true
        codesign --force --deep --sign - "build/PlugTune_artefacts/Release/AU/PlugTune.component" 2>/dev/null || true
        codesign --force --deep --sign - "build/PluggedIN_Central_artefacts/Release/PluggedIN Central.app" 2>/dev/null || true

        # Package Individual Plugin Bundles
        cd build/UNDERGROUND_artefacts/Release
        if [ -d "VST3/UNDERGROUND.vst3" ]; then
          zip -r -y ../../../dist/mac/UNDERGROUND_Mac_Universal.vst3.zip VST3/UNDERGROUND.vst3
        fi
        if [ -d "AU/UNDERGROUND.component" ]; then
          zip -r -y ../../../dist/mac/UNDERGROUND_Mac_Universal.component.zip AU/UNDERGROUND.component
        fi
        cd ../../../

        if [ -d "build/PluggedIN_Central_artefacts/Release/PluggedIN Central.app" ]; then
          cd "build/PluggedIN_Central_artefacts/Release"
          zip -r -y ../../../dist/mac/PluggedIN_Central_Mac.zip "PluggedIN Central.app"
          cd ../../../
        fi

        if [ -d "build/Plugged_1_artefacts/Release/VST3/Plugged 1.vst3" ]; then
          cd "build/Plugged_1_artefacts/Release"
          zip -r -y ../../../dist/mac/PLUGGED_1_Mac_Universal.vst3.zip "VST3/Plugged 1.vst3"
          cd ../../../
        fi

        if [ -d "build/PlugTune_artefacts/Release/VST3/PlugTune.vst3" ]; then
          cd "build/PlugTune_artefacts/Release"
          zip -r -y ../../../dist/mac/PlugTune_Mac_Universal.vst3.zip "VST3/PlugTune.vst3"
          cd ../../../
        fi

    - name: Check out releases repo for atomic manifest update
      uses: actions/checkout@v4
      with:
        repository: dylangoodm2468590840/pluggedin-releases-
        token: ${{ secrets.SOURCE_PAT }}
        ref: main
        path: releases-repo

    - name: Automatically sync SHA-256 checksums to manifest.json
      run: |
        python3 - << 'EOF'
        import hashlib, json, os

        def get_file_info(filepath):
            if not os.path.isfile(filepath):
                return None, 0
            hasher = hashlib.sha256()
            with open(filepath, 'rb') as f:
                while chunk := f.read(65536):
                    hasher.update(chunk)
            return hasher.hexdigest(), os.path.getsize(filepath)

        manifest_path = "releases-repo/manifest.json"
        with open(manifest_path, "r", encoding="utf-8") as f:
            manifest = json.load(f)

        # Central App
        h, s = get_file_info("dist/mac/PluggedIN_Central_Mac.zip")
        if h and "manager" in manifest and "packages" in manifest["manager"]:
            manifest["manager"]["packages"]["macos_universal"]["sha256"] = h
            manifest["manager"]["packages"]["macos_universal"]["size_bytes"] = s
            print(f"[SYNC] Central Mac: {h} ({s} bytes)")

        # Plugins
        plugin_map = {
            "pluggedin_plugtune": "dist/mac/PlugTune_Mac_Universal.vst3.zip",
            "pluggedin_underground": "dist/mac/UNDERGROUND_Mac_Universal.vst3.zip",
            "pluggedin_plugged1": "dist/mac/PLUGGED_1_Mac_Universal.vst3.zip"
        }

        for plugin in manifest.get("plugins", []):
            pid = plugin.get("id")
            if pid in plugin_map:
                ph, ps = get_file_info(plugin_map[pid])
                if ph and "packages" in plugin and "macos_universal" in plugin["packages"]:
                    plugin["packages"]["macos_universal"]["sha256"] = ph
                    plugin["packages"]["macos_universal"]["size_bytes"] = ps
                    print(f"[SYNC] {pid} Mac: {ph} ({ps} bytes)")

        with open(manifest_path, "w", encoding="utf-8") as f:
            json.dump(manifest, f, indent=4)
        print("[SYNC] Successfully updated manifest.json on runner!")
        EOF

        cd releases-repo
        git config user.name "PluggedIN Automated Pipeline"
        git config user.email "ci@pluggedinaudio.com"
        git add manifest.json
        if git diff --staged --quiet; then
          echo "Manifest already in sync, no commit needed."
        else
          git commit -m "chore(manifest): auto-sync macOS SHA-256 checksums from CI build [skip ci]"
          git push origin HEAD:main
          echo "Pushed updated manifest.json to releases repo successfully."
        fi
        cd ..

    - name: Upload Mac Artifacts to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: PluggedIN_macOS_Universal_Binaries
        path: dist/mac/*

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        name: "PluggedIN macOS Universal - ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}"
        body: |
          ## PluggedIN macOS Universal Binaries
          **Architecture:** Apple Silicon (arm64) + Intel (x86_64) Universal Binary
          **macOS minimum:** 10.13 High Sierra
          **Formats included:** VST3, AU (Logic Pro / GarageBand)
        draft: false
        prerelease: false
        files: dist/mac/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}