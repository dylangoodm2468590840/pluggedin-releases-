name: Build macOS VST3 & AU (Apple Silicon + Intel Universal)

on:
  push:
    branches: [ "main" ]
    tags:
      - "mac-v*"
      - "plugtune-dev*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. plugtune-dev1059)'
        required: false
        default: 'plugtune-dev1059'

jobs:
  build-macos:
    runs-on: macos-13

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Configure CMake for Universal macOS (arm64 + x86_64)
      run: |
        cmake -B build -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="10.13"

    - name: Build macOS VST3, AU & PlugTune
      run: |
        cmake --build build --config Release --target UNDERGROUND_VST3 UNDERGROUND_AU PluggedIN_Central PlugTune_VST3

    - name: Package macOS Artifacts
      run: |
        mkdir -p dist/mac
        cd build/UNDERGROUND_artefacts/Release
        if [ -d "VST3/UNDERGROUND.vst3" ]; then
          zip -r -y ../../../dist/mac/UNDERGROUND_Mac_Universal.vst3.zip VST3/UNDERGROUND.vst3
        fi
        if [ -d "AU/UNDERGROUND.component" ]; then
          zip -r -y ../../../dist/mac/UNDERGROUND_Mac_Universal.component.zip AU/UNDERGROUND.component
        fi
        cd ../../../
        if [ -d "build/PluggedIN_Central_artefacts/Release/PluggedIN Central.app" ]; then
          cd "build/PluggedIN_Central_artefacts/Release"
          zip -r -y ../../../dist/mac/PluggedIN_Central_Mac.zip "PluggedIN Central.app"
          cd ../../../
        fi
        if [ -d "build/Plugged_1_artefacts/Release/VST3/Plugged 1.vst3" ]; then
          cd "build/Plugged_1_artefacts/Release"
          zip -r -y ../../../dist/mac/PLUGGED_1_Mac_Universal.vst3.zip "VST3/Plugged 1.vst3"
          cd ../../../
        fi
        if [ -d "build/PlugTune_artefacts/Release/VST3/PlugTune.vst3" ]; then
          cd "build/PlugTune_artefacts/Release"
          zip -r -y ../../../dist/mac/PlugTune_Mac_Universal.vst3.zip "VST3/PlugTune.vst3"
          cd ../../../
          echo "PlugTune Mac packaged successfully"
        fi
        echo "=== SHA-256 checksums ==="
        for f in dist/mac/*.zip; do shasum -a 256 "$f"; done

    - name: Upload Mac Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PluggedIN_macOS_Universal_Binaries
        path: dist/mac/*

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || 'plugtune-dev1059') }}
        name: "PluggedIN - ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || 'plugtune-dev1059') }}"
        body: "Automated macOS Universal build (arm64+x86_64)."
        draft: false
        prerelease: true
        files: |
          dist/mac/UNDERGROUND_Mac_Universal.vst3.zip
          dist/mac/UNDERGROUND_Mac_Universal.component.zip
          dist/mac/PluggedIN_Central_Mac.zip
          dist/mac/PLUGGED_1_Mac_Universal.vst3.zip
          dist/mac/PlugTune_Mac_Universal.vst3.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
