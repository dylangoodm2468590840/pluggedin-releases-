name: Build macOS VST3 & AU (Apple Silicon + Intel Universal)

on:
  push:
    branches: [ "main" ]
    tags:
      - "mac-v*"          # e.g. mac-v4.0.0  — triggers a tagged release build
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. mac-v4.0.0). Leave blank to skip release.'
        required: false
        default: ''

jobs:
  build-macos:
    runs-on: macos-14 # Apple Silicon M1/M2/M3 native runner
    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Configure CMake for Universal macOS (arm64 + x86_64)
      run: |
        cmake -B build -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="10.13"

    - name: Build macOS VST3, AU Component & Central App
      run: |
        cmake --build build --config Release --target UNDERGROUND_VST3
        cmake --build build --config Release --target UNDERGROUND_AU
        cmake --build build --config Release --target PluggedIN_Central
        cmake --build build --config Release --target Plugged_1_VST3
        cmake --build build --config Release --target Plugged_1_AU
        if cmake --build build --target help | grep -q "PlugTune_VST3"; then
          cmake --build build --config Release --target PlugTune_VST3 || true
          cmake --build build --config Release --target PlugTune_AU || true
        fi

    - name: Package macOS Artifacts
      run: |
        mkdir -p dist/mac
        
        # Ensure full 755 POSIX permissions and ad-hoc codesigning on all bundles
        chmod -R 755 build/UNDERGROUND_artefacts/Release/ 2>/dev/null || true
        chmod -R 755 build/Plugged_1_artefacts/Release/ 2>/dev/null || true
        chmod -R 755 build/PlugTune_artefacts/Release/ 2>/dev/null || true
        chmod -R 755 build/PluggedIN_Central_artefacts/Release/ 2>/dev/null || true
        
        codesign --force --deep --sign - "build/UNDERGROUND_artefacts/Release/VST3/UNDERGROUND.vst3" 2>/dev/null || true
        codesign --force --deep --sign - "build/UNDERGROUND_artefacts/Release/AU/UNDERGROUND.component" 2>/dev/null || true
        codesign --force --deep --sign - "build/Plugged_1_artefacts/Release/VST3/Plugged 1.vst3" 2>/dev/null || true
        codesign --force --deep --sign - "build/Plugged_1_artefacts/Release/AU/Plugged 1.component" 2>/dev/null || true
        codesign --force --deep --sign - "build/PlugTune_artefacts/Release/VST3/PlugTune.vst3" 2>/dev/null || true
        codesign --force --deep --sign - "build/PlugTune_artefacts/Release/AU/PlugTune.component" 2>/dev/null || true
        codesign --force --deep --sign - "build/PluggedIN_Central_artefacts/Release/PluggedIN Central.app" 2>/dev/null || true

        # Package Individual Plugin Bundles (Combined VST3 + AU)
        # 1. UNDERGROUND
        mkdir -p dist/stage_underground
        [ -d "build/UNDERGROUND_artefacts/Release/VST3/UNDERGROUND.vst3" ] && cp -R "build/UNDERGROUND_artefacts/Release/VST3/UNDERGROUND.vst3" dist/stage_underground/
        [ -d "build/UNDERGROUND_artefacts/Release/AU/UNDERGROUND.component" ] && cp -R "build/UNDERGROUND_artefacts/Release/AU/UNDERGROUND.component" dist/stage_underground/
        cd dist/stage_underground
        zip -r -y ../mac/UNDERGROUND_Mac_Universal.zip *
        zip -r -y ../mac/UNDERGROUND_Mac_Universal.vst3.zip *
        cd ../..
        echo "UNDERGROUND VST3 + AU packaged"

        # 2. PLUGGED 1
        mkdir -p dist/stage_plugged1
        [ -d "build/Plugged_1_artefacts/Release/VST3/Plugged 1.vst3" ] && cp -R "build/Plugged_1_artefacts/Release/VST3/Plugged 1.vst3" dist/stage_plugged1/
        [ -d "build/Plugged_1_artefacts/Release/AU/Plugged 1.component" ] && cp -R "build/Plugged_1_artefacts/Release/AU/Plugged 1.component" dist/stage_plugged1/
        cd dist/stage_plugged1
        zip -r -y ../mac/PLUGGED_1_Mac_Universal.zip *
        zip -r -y ../mac/PLUGGED_1_Mac_Universal.vst3.zip *
        cd ../..
        echo "Plugged 1 VST3 + AU packaged"

        # 3. PLUGTUNE
        mkdir -p dist/stage_plugtune
        [ -d "build/PlugTune_artefacts/Release/VST3/PlugTune.vst3" ] && cp -R "build/PlugTune_artefacts/Release/VST3/PlugTune.vst3" dist/stage_plugtune/
        [ -d "build/PlugTune_artefacts/Release/AU/PlugTune.component" ] && cp -R "build/PlugTune_artefacts/Release/AU/PlugTune.component" dist/stage_plugtune/
        cd dist/stage_plugtune
        zip -r -y ../mac/PlugTune_Mac_Universal.zip *
        zip -r -y ../mac/PlugTune_Mac_Universal.vst3.zip *
        cd ../..
        echo "PlugTune VST3 + AU packaged"

        # 4. PLUGGEDIN CENTRAL (.zip + .dmg)
        if [ -d "build/PluggedIN_Central_artefacts/Release/PluggedIN Central.app" ]; then
          cd "build/PluggedIN_Central_artefacts/Release"
          zip -r -y ../../../dist/mac/PluggedIN_Central_Mac.zip "PluggedIN Central.app"
          
          mkdir -p ../../../dist/dmg_staging
          cp -R "PluggedIN Central.app" ../../../dist/dmg_staging/
          ln -s /Applications ../../../dist/dmg_staging/Applications
          hdiutil create -volname "PluggedIN Central" -srcfolder ../../../dist/dmg_staging -ov -format UDZO ../../../dist/mac/PluggedIN_Central.dmg 2>/dev/null || true
          echo "Central Mac app & DMG packaged"
          cd ../../../
        fi

        # Package Complete 1-Click Studio Bundle for Direct Distribution
        mkdir -p dist/mac_bundle_staging
        cp -R "installer/1-CLICK_INSTALL_MAC.command" dist/mac_bundle_staging/
        chmod 755 "dist/mac_bundle_staging/1-CLICK_INSTALL_MAC.command"
        cp -R "installer/FIX_MAC_FL_STUDIO.command" dist/mac_bundle_staging/
        chmod 755 "dist/mac_bundle_staging/FIX_MAC_FL_STUDIO.command"
        cp -R "build/PluggedIN_Central_artefacts/Release/PluggedIN Central.app" dist/mac_bundle_staging/ 2>/dev/null || true
        cp -R "build/UNDERGROUND_artefacts/Release/VST3/UNDERGROUND.vst3" dist/mac_bundle_staging/ 2>/dev/null || true
        cp -R "build/UNDERGROUND_artefacts/Release/AU/UNDERGROUND.component" dist/mac_bundle_staging/ 2>/dev/null || true
        cp -R "build/Plugged_1_artefacts/Release/VST3/Plugged 1.vst3" dist/mac_bundle_staging/ 2>/dev/null || true
        cp -R "build/Plugged_1_artefacts/Release/AU/Plugged 1.component" dist/mac_bundle_staging/ 2>/dev/null || true
        cp -R "build/PlugTune_artefacts/Release/VST3/PlugTune.vst3" dist/mac_bundle_staging/ 2>/dev/null || true
        cp -R "build/PlugTune_artefacts/Release/AU/PlugTune.component" dist/mac_bundle_staging/ 2>/dev/null || true
        
        cd dist/mac_bundle_staging
        zip -r -y ../mac/PluggedIN_Complete_macOS_Bundle.zip *
        cd ../../

        # Print SHA-256 for each file
        echo "=== SHA-256 checksums ==="
        for f in dist/mac/*.zip; do
          shasum -a 256 "$f"
        done

    - name: Upload Mac Artifacts to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: PluggedIN_macOS_Universal_Binaries
        path: dist/mac/*

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/mac-v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        name: "PluggedIN macOS Universal — ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}"
        body: |
          ## PluggedIN macOS Universal Binaries
          **Architecture:** Apple Silicon (arm64) + Intel (x86_64) Universal Binary
          **macOS minimum:** 10.13 High Sierra
          **Formats included:** VST3, AU (Logic Pro / GarageBand)
        draft: false
        prerelease: false
        files: dist/mac/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
