name: Build macOS VST3 & AU (Apple Silicon + Intel Universal)

on:
  push:
    branches: [ "main" ]
    tags:
      - "mac-v*"
      - "plugtune-dev*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. plugtune-dev1059)'
        required: false
        default: 'plugtune-dev1059'

jobs:
  build-macos:
    runs-on: macos-14

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Download signalsmith DSP headers
      run: |
        mkdir -p libs/signalsmith-linear
        curl -sL https://raw.githubusercontent.com/Signalsmith-Audio/signalsmith-stretch/main/signalsmith-stretch.h -o libs/signalsmith-stretch.h
        curl -sL https://raw.githubusercontent.com/Signalsmith-Audio/signalsmith-stretch/main/signalsmith-linear/fft.h -o libs/signalsmith-linear/fft.h
        curl -sL https://raw.githubusercontent.com/Signalsmith-Audio/signalsmith-stretch/main/signalsmith-linear/stft.h -o libs/signalsmith-linear/stft.h
        mkdir -p Source/PlugTune
        cp libs/signalsmith-stretch.h Source/PlugTune/
        cp -r libs/signalsmith-linear Source/PlugTune/

    - name: Configure CMake for Universal macOS (arm64 + x86_64)
      run: |
        export CFLAGS="-Wno-error -Wno-deprecated-declarations -Wno-unguarded-availability-new"
        export CXXFLAGS="-Wno-error -Wno-deprecated-declarations -Wno-unguarded-availability-new"
        cmake -B build -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
          -DCMAKE_C_FLAGS="-Wno-error -Wno-deprecated-declarations -Wno-unguarded-availability-new" \
          -DCMAKE_CXX_FLAGS="-Wno-error -Wno-deprecated-declarations -Wno-unguarded-availability-new"

    - name: Build macOS PlugTune VST3
      run: |
        cmake --build build --config Release --target PlugTune_VST3

    - name: Package macOS Artifacts
      run: |
        mkdir -p dist/mac
        if [ -d "build/PlugTune_artefacts/Release/VST3/PlugTune.vst3" ]; then
          cd "build/PlugTune_artefacts/Release"
          zip -r -y ../../../dist/mac/PlugTune_Mac_Universal.vst3.zip "VST3/PlugTune.vst3"
          cd ../../../
          echo "PlugTune Mac packaged successfully"
        fi
        echo "=== SHA-256 checksums ==="
        for f in dist/mac/*.zip; do shasum -a 256 "$f"; done

    - name: Upload Mac Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PluggedIN_macOS_Universal_Binaries
        path: dist/mac/*

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || 'plugtune-dev1059') }}
        name: "PluggedIN - ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || 'plugtune-dev1059') }}"
        body: "Automated macOS Universal build (arm64+x86_64)."
        draft: false
        prerelease: true
        files: |
          dist/mac/PlugTune_Mac_Universal.vst3.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
