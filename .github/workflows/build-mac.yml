name: Build macOS VST3 (Apple Silicon + Intel Universal)

on:
  push:
    branches: [ "main" ]
    tags:
      - "mac-v*"
      - "plugtune-dev*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. plugtune-dev1059)'
        required: false
        default: 'plugtune-dev1059'

jobs:
  build-macos:
    runs-on: macos-14

    steps:
    - name: Checkout PlugTune Clean Source
      uses: actions/checkout@v4
      with:
        repository: dylangoodm2468590840/plugtune-source
        path: plugtune-source

    - name: Set up CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Configure CMake for Universal macOS (arm64 + x86_64)
      run: |
        export CFLAGS="-Wno-error -Wno-deprecated-declarations -Wno-unguarded-availability-new"
        export CXXFLAGS="-Wno-error -Wno-deprecated-declarations -Wno-unguarded-availability-new"
        cmake -B build_pt -S plugtune-source -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
          -DCMAKE_C_FLAGS="-Wno-error -Wno-deprecated-declarations -Wno-unguarded-availability-new" \
          -DCMAKE_CXX_FLAGS="-Wno-error -Wno-deprecated-declarations -Wno-unguarded-availability-new"

    - name: Build PlugTune Universal macOS VST3
      run: |
        cmake --build build_pt --config Release --target PlugTune_VST3

    - name: Package macOS Artifacts
      run: |
        mkdir -p dist/mac
        cd build_pt/PlugTune_artefacts/Release/VST3
        zip -r ../../../../dist/mac/PlugTune_Mac_Universal.vst3.zip PlugTune.vst3
        cd ../../../../
        echo "=== SHA-256 Checksum ==="
        shasum -a 256 dist/mac/PlugTune_Mac_Universal.vst3.zip

    - name: Upload Mac Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PlugTune_Mac_Universal
        path: dist/mac/*

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || 'plugtune-dev1059') }}
        name: "PlugTune DEV-1059"
        body: "PlugTune v1.0.0 DEV-1059 Universal macOS VST3 (Apple Silicon + Intel)."
        draft: false
        prerelease: true
        files: |
          dist/mac/PlugTune_Mac_Universal.vst3.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
