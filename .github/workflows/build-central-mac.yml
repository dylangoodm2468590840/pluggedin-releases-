name: Build PluggedIN Central & Plugin Mac

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target GitHub release tag'
        required: false
        default: 'central-v2.6.0'
      target_filter:
        description: 'Space-separated CMake VST3 targets (or empty for all)'
        required: false
        default: ''

jobs:
  build-macos:
    name: Build Central App
    runs-on: [self-hosted, macOS]
    if: startsWith(inputs.release_tag, 'central')
    permissions:
      contents: write

    steps:
      - name: Download and Extract Hub Source (Preserving node_modules Cache)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf hub/src hub/dist hub/dist-electron hub/release hub-source.zip
          mkdir -p hub
          gh release download "${{ inputs.release_tag || 'central-v3.0.6' }}" -p "hub-source.zip" -R "${{ github.repository }}"
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('hub-source.zip') as z:
              for member in z.infolist():
                  clean = member.filename.replace(chr(92), '/')
                  target = os.path.join('hub', clean)
                  if clean.endswith('/'):
                      os.makedirs(target, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with open(target, 'wb') as f:
                          f.write(z.read(member))
          "

      - name: Install dependencies & Build macOS Universal App (.dmg and .zip)
        working-directory: hub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then NODE_ARCH="x64"; else NODE_ARCH="arm64"; fi
          if [ ! -x "$HOME/.local/node/bin/npm" ]; then
            echo "Bootstrapping Node.js v22.14.0 ($NODE_ARCH) into $HOME/.local/node..."
            mkdir -p "$HOME/.local/node"
            curl -fsSL "https://nodejs.org/dist/v22.14.0/node-v22.14.0-darwin-${NODE_ARCH}.tar.gz" | tar -xz -C "$HOME/.local/node" --strip-components=1
          fi
          export PATH="$HOME/.local/node/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "Using node: $(which node) ($(node -v)) and npm: $(which npm) ($(npm -v))"
          if [ ! -d "node_modules/electron" ]; then
            npm ci
          else
            echo "Cached node_modules detected - skipping full npm ci!"
          fi
          npm run dist:mac

      - name: Compute SHA-256 & Upload Mac Binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd hub/release
          if [ -f "PluggedIN.Central_Mac_Universal_3.0.7.dmg" ]; then
            cp -f "PluggedIN.Central_Mac_Universal_3.0.7.dmg" "PluggedIN.Central_Mac_Universal_3.0.6.dmg"
          fi
          if [ -f "PluggedIN.Central_Mac_Universal_3.0.7.zip" ]; then
            cp -f "PluggedIN.Central_Mac_Universal_3.0.7.zip" "PluggedIN.Central_Mac_Universal_3.0.6.zip"
          fi
          for f in *.dmg *.zip; do
            if [ -f "$f" ]; then
              shasum -a 256 "$f" > "${f}.sha256"
            fi
          done
          for f in *.dmg *.zip *.yml *.blockmap *.sha256; do
            if [ -f "$f" ]; then
              gh release upload "${{ inputs.release_tag || 'central-v3.0.6' }}" "$f" --clobber -R "${{ github.repository }}"
            fi
          done

  build-plugin:
    name: macOS Universal Plugin (arm64 + x86_64) & QA
    runs-on: [self-hosted, macOS]
    if: "!startsWith(inputs.release_tag, 'central')"
    permissions:
      contents: write

    steps:
      - name: Install Ninja
        run: which ninja || brew install ninja || true

      - name: Incremental Extract Plugin Source (Preserve Timestamps)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f plugin-source.zip
          rm -rf "$GITHUB_WORKSPACE/dist_mac"
          mkdir -p plugin
          gh release download "${{ inputs.release_tag }}" -p "plugin-source.zip" -R "${{ github.repository }}" --clobber
          python3 -c "
          import zipfile, os
          updated = 0
          skipped = 0
          with zipfile.ZipFile('plugin-source.zip') as z:
              for member in z.infolist():
                  clean = member.filename.replace(chr(92), '/')
                  target = os.path.join('plugin', clean)
                  if clean.endswith('/'):
                      os.makedirs(target, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      data = z.read(member)
                      if os.path.exists(target):
                          try:
                              with open(target, 'rb') as rf:
                                  if rf.read() == data:
                                      skipped += 1
                                      continue
                          except Exception:
                              pass
                      with open(target, 'wb') as f:
                          f.write(data)
                      updated += 1
          print(f'Incremental extract complete: {updated} files updated, {skipped} unchanged files preserved!')
          "

      - name: Configure CMake (Catalina 10.15 Target + Universal)
        working-directory: plugin
        run: |
          if [ ! -f "build/build.ninja" ]; then
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"
          else
            echo "Ninja build graph already configured — skipping redundant cmake configure."
          fi

      - name: Patch JUCE bundleExit Teardown Bug (If Needed)
        working-directory: plugin
        run: |
          python3 << 'EOF'
          import os, re
          target_file = None
          for root, dirs, files in os.walk('build'):
              if 'juce_audio_plugin_client_VST3.cpp' in files:
                  target_file = os.path.join(root, 'juce_audio_plugin_client_VST3.cpp')
                  break
          if not target_file and os.path.exists('libs/JUCE/modules/juce_audio_plugin_client/juce_audio_plugin_client_VST3.cpp'):
              target_file = 'libs/JUCE/modules/juce_audio_plugin_client/juce_audio_plugin_client_VST3.cpp'

          if target_file:
              with open(target_file, 'r') as f:
                  content = f.read()
              new_exit = "JUCE_EXPORTED_FUNCTION bool bundleExit()\n{\n    shutdownModule();\n    return true;\n}"
              patched = re.sub(r'JUCE_EXPORTED_FUNCTION\s+bool\s+bundleExit\s*\(\)\s*\{[\s\S]*?return\s+false;\s*\}', new_exit, content)
              if patched != content:
                  with open(target_file, 'w') as f:
                      f.write(patched)
                  print('JUCE bundleExit patched!')
              else:
                  print('JUCE bundleExit already patched — preserving file timestamp!')
          EOF

      - name: Compile Targets
        working-directory: plugin
        run: |
          TARGETS="${{ inputs.target_filter }}"
          if [ -z "$TARGETS" ]; then
            TARGETS="PlugTune_VST3 PlugVox_VST3 PlugOpto_VST3 PlugGlue_VST3 PlugEq_VST3 PlugDelay_VST3 PlugVerb_VST3 PlugLimit_VST3 PlugRack_VST3 PlugSilky_VST3 PlugBlue_VST3 PlugChop_VST3 PlugWarp_VST3 Plugged1_VST3 PlugAmp_VST3 PlugKnock_VST3 PlugGrand_VST3 PlugAxe_VST3"
          fi
          echo "=== Building Targets: $TARGETS ==="
          cmake --build build --config Release --target $TARGETS --parallel

      - name: Ad-Hoc Sign & Package Updated macOS Universal Binaries
        working-directory: plugin
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist_mac"
          TARGETS="${{ inputs.target_filter }}"
          if [ -z "$TARGETS" ]; then
            TARGETS="PlugTune_VST3 PlugVox_VST3 PlugOpto_VST3 PlugGlue_VST3 PlugEq_VST3 PlugDelay_VST3 PlugVerb_VST3 PlugLimit_VST3 PlugRack_VST3 PlugSilky_VST3 PlugBlue_VST3 PlugChop_VST3 PlugWarp_VST3 Plugged1_VST3 PlugAmp_VST3 PlugKnock_VST3 PlugGrand_VST3 PlugAxe_VST3"
          fi
          for t in $TARGETS; do
            prefix="${t%_VST3}"
            for art in build/${prefix}_artefacts/Release/VST3/*.vst3; do
              if [ -d "$art" ]; then
                echo "Signing: $art"
                codesign --force --deep --sign - --options runtime "$art"
                bname=$(basename "$art" .vst3)
                echo "Packaging $bname..."
                (cd "$(dirname "$art")/.." && zip -r -y "$GITHUB_WORKSPACE/dist_mac/${bname}_Mac_Universal.vst3.zip" "VST3/${bname}.vst3")
              fi
            done
          done
          if [ -f "$GITHUB_WORKSPACE/dist_mac/PLUGTNE_Mac_Universal.vst3.zip" ]; then
            cp -f "$GITHUB_WORKSPACE/dist_mac/PLUGTNE_Mac_Universal.vst3.zip" "$GITHUB_WORKSPACE/dist_mac/PlugTune_Mac_Universal.vst3.zip" || true
          fi
          if [ -f "$GITHUB_WORKSPACE/dist_mac/Plugged 1_Mac_Universal.vst3.zip" ]; then
            cp -f "$GITHUB_WORKSPACE/dist_mac/Plugged 1_Mac_Universal.vst3.zip" "$GITHUB_WORKSPACE/dist_mac/PLUGGED_1_Mac_Universal.vst3.zip" || true
            cp -f "$GITHUB_WORKSPACE/dist_mac/Plugged 1_Mac_Universal.vst3.zip" "$GITHUB_WORKSPACE/dist_mac/Plugged1_Mac_Universal.vst3.zip" || true
          fi
          ls -la "$GITHUB_WORKSPACE/dist_mac"

      - name: Compute SHA-256 Hashes & Upload Mac Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/dist_mac"
          for z in *.zip; do
            if [ -f "$z" ]; then
              shasum -a 256 "$z" > "${z}.sha256"
              cat "${z}.sha256"
            fi
          done
          for z in *.zip *.sha256; do
            if [ -f "$z" ]; then
              gh release upload "${{ inputs.release_tag }}" "$z" --clobber -R "${{ github.repository }}"
            fi
          done